common_config: common.yaml
workflow_name: control_line24
selection:
  line_id: '24'
  genotype: control
paths:
  prepared_dir: path/to/prepared/morphology/control_line24
  output_dir: path/to/results/morphology/control_line24
states:
  stem:
    input_parquet: path/to/annotated/stem.parquet
  npc:
    input_parquet: path/to/annotated/npc.parquet
  neuron1:
    input_parquet: path/to/annotated/neuron_batch1.parquet
  astro1:
    input_parquet: path/to/annotated/astrocyte_batch1.parquet
transitions:
- label: Stem → NPC
  source: stem
  target: npc
  enabled: true
  evaluation:
    correlation_sampling: full
    ks_sampling: full
    std_ddof: 1
    nan_aware: true
    nn_method: train_common_scaled_5nn
- label: NPC → Neuron
  source: npc
  target: neuron1
  enabled: true
  evaluation:
    correlation_sampling: full
    ks_sampling: equal
    std_ddof: 0
    nan_aware: false
    nn_method: validation_unscaled_5nn
- label: NPC → Astrocyte
  source: npc
  target: astro1
  enabled: true
  evaluation:
    correlation_sampling: full
    ks_sampling: equal
    std_ddof: 0
    nan_aware: false
    nn_method: validation_unscaled_5nn
cyclegan:
  steps_per_epoch_from: target
