common_config: common.yaml
dataset_name: Independent cerebral organoid maturation dataset (18 days to 61 days)
run_name: shared_hurdleAE_organoid_18d_61d
source_state: 18d
target_state: 61d

paths:
  prepared_dir: path/to/prepared/third_organoid
  output_dir: path/to/results/third_organoid

preparation:
  input_type: h5ad_age
  input_h5ad: path/to/third_organoid_dataset.h5ad
  age_column: age
  selected_ages_days: [4, 9, 12, 18, 21, 61]
  hvg_flavor: seurat_v3
  n_hvg: 5000

interpretability:
  enabled: false
