common_config: common.yaml
dataset_name: Primary cerebral organoid maturation (2 months to 6 months)
run_name: shared_hurdleAE_organoid_2m_6m
source_state: 2month
target_state: 6month

paths:
  prepared_dir: path/to/prepared/primary_organoid
  output_dir: path/to/results/primary_organoid

preparation:
  input_type: mtx_series
  hvg_flavor: seurat_v3
  n_hvg: 5000
  # Inputs are the normalized expression matrices used in the source analysis.
  # HVGs are selected jointly across all six maturation timepoints.
  timepoints:
    1month:
      expression: path/to/primary/1month_expression.mtx
      barcodes: path/to/primary/1month_barcodes.txt
      genes: path/to/primary/1month_genes.txt
    2month:
      expression: path/to/primary/2month_expression.mtx
      barcodes: path/to/primary/2month_barcodes.txt
      genes: path/to/primary/2month_genes.txt
    3month:
      expression: path/to/primary/3month_expression.mtx
      barcodes: path/to/primary/3month_barcodes.txt
      genes: path/to/primary/3month_genes.txt
    4month:
      expression: path/to/primary/4month_expression.mtx
      barcodes: path/to/primary/4month_barcodes.txt
      genes: path/to/primary/4month_genes.txt
    5month:
      expression: path/to/primary/5month_expression.mtx
      barcodes: path/to/primary/5month_barcodes.txt
      genes: path/to/primary/5month_genes.txt
    6month:
      expression: path/to/primary/6month_expression.mtx
      barcodes: path/to/primary/6month_barcodes.txt
      genes: path/to/primary/6month_genes.txt

interpretability:
  enabled: true
  seed: 42
  ig_steps: 64
  ig_max_samples: 1024
  ig_batch_size: 16
  driver_eps: 0.00000001
  lfc_clip: 6.0
  detection_threshold: 0.0
  min_detection_fraction: 0.10
  category_quantile: 0.75
