      CellOT: "path/to/predictions/APOE/cellot.npy"
      scGPT: "path/to/predictions/APOE/scgpt.npy"
  ANKRD12:
    control: "path/to/prepared/control.npy"
    real: "path/to/prepared/ankrd12.npy"
    predictions:
      CellTranslator: "path/to/predictions/ANKRD12/celltranslator.npy"
      scGEN: "path/to/predictions/ANKRD12/scgen.npy"
      CellOT: "path/to/predictions/ANKRD12/cellot.npy"
