# Placeholder-only paths for the final cross-model comparison.
output_dir: "path/to/results/genetic_perturbation/model_comparison"
threshold: 1.0e-6
top_de_genes: 5000
ks_bad_threshold: 0.20
models: [CellTranslator, scGEN, CellOT, scGPT]

perturbations:
  NR1H3:
    control: "path/to/prepared/control.npy"
    real: "path/to/prepared/nr1h3.npy"
    predictions:
      CellTranslator: "path/to/predictions/NR1H3/celltranslator.npy"
      scGEN: "path/to/predictions/NR1H3/scgen.npy"
      CellOT: "path/to/predictions/NR1H3/cellot.npy"
      scGPT: "path/to/predictions/NR1H3/scgpt.npy"
  LRRC4C:
    control: "path/to/prepared/control.npy"
    real: "path/to/prepared/lrrc4c.npy"
