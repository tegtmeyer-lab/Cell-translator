      scGEN: "path/to/predictions/LRRC4C/scgen.npy"
      CellOT: "path/to/predictions/LRRC4C/cellot.npy"
      scGPT: "path/to/predictions/LRRC4C/scgpt.npy"
  MSI2:
    control: "path/to/prepared/control.npy"
    real: "path/to/prepared/msi2.npy"
    predictions:
