# Placeholder-only paths. Replace these locally; do not commit private paths.
perturbations: [APOE, MSI2, NR1H3, LRRC4C, ANKRD12]

common_test_control_ids: "path/to/benchmark_outputs/common_test_control_ids.txt"

dataset:
  h5ad: "path/to/neuron_ctrl_plus_5perts_log1p_uniqueObs.h5ad"
  gene_names: "path/to/gene_names.npy"
  control_matrix: "path/to/control.npy"
  condition_key: "condition"
  control_label: "ctrl"
  expected_shape: [21971, 18614]
  expected_test_control_cells: 2106
  expected_condition_counts:
    ctrl: 10529
    LRRC4C: 8828
    MSI2: 684
    APOE: 681
    NR1H3: 681
    ANKRD12: 568

targets:
  APOE: "path/to/apoe.npy"
  MSI2: "path/to/msi2.npy"
  NR1H3: "path/to/nr1h3.npy"
  LRRC4C: "path/to/lrrc4c.npy"
  ANKRD12: "path/to/ankrd12.npy"

cellot:
  # Exact upstream CellOT commit/version was not recorded in the supplied notebook.
  upstream_repo: "path/to/cellot_checkout"
  model_config_relative: "configs/models/cellot.yaml"
  output_root: "path/to/benchmark_outputs/cellot"
  n_hvg: 2000
  hvg_flavor: "seurat"
  n_pcs: 50
  pca_random_state: 0
  batch_size: 256
  test_size: 0.20
  split_random_state: 0
  n_iters: 100000
  logs_freq: 2000
  eval_freq: 10000
  evaluation_setting: "iid"
  evaluation_space: "data_space"
  recover_expm1_like_pca_output: true
  clip_gene_space_nonnegative: true

scgen:
  output_root: "path/to/benchmark_outputs/scgen"
  max_epochs: 50
  seed: null  # original notebook did not explicitly set a seed
  recorded_python: "3.10.19"
  recorded_scgen_version: "2.1.1"
  recorded_scvi_tools_version: "1.3.3"

scgpt:
  # The supplied notebook is not a complete from-scratch scGPT training recipe.
  # This section reproduces the final postprocessing from archived raw prediction NPZ files.
  output_root: "path/to/benchmark_outputs/scgpt"
  raw_npz:
    APOE: "path/to/scgpt_raw/APOE_plus_ctrl_CTRL2106.npz"
    MSI2: "path/to/scgpt_raw/MSI2_plus_ctrl_CTRL2106.npz"
    NR1H3: "path/to/scgpt_raw/NR1H3_plus_ctrl_CTRL2106.npz"
    LRRC4C: "path/to/scgpt_raw/LRRC4C_plus_ctrl_CTRL2106.npz"
    ANKRD12: "path/to/scgpt_raw/ANKRD12_plus_ctrl_CTRL2106.npz"
  prediction_semantics: "delta_to_absolute_control_mean"
  clip_nonnegative: true
  detection_threshold: 1.0e-6
  recorded_python: "3.10"
  recorded_scgpt_version: "0.2.4"
  recorded_torch_version: "2.3.1+cu118"
  recorded_torchtext_version: "0.18.0+cpu"
  # Not recorded/defined in the supplied notebook and therefore not invented here:
  max_seq_len: null
  gears_version: null
  torch_geometric_version: null
