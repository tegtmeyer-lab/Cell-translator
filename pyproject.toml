[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-translator"
version = "1.0.0"
description = "Cell Translator: a generative framework for predicting transcriptional and morphological cell state translations across biological systems"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "matplotlib",
  "PyYAML",
  "torch",
  "tensorflow",
  "scanpy",
  "umap-learn",
  "pyarrow",
]

[tool.setuptools.packages.find]
include = ["cell_translator*"]
